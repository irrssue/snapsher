<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" role="img" aria-label="Snapsher">
  <rect width="180" height="180" rx="40" fill="#0c1014"/>
  <!-- The countdown ring: the unserved window in grey, the part already waited
       out in white, and the photo itself at the centre. -->
  <circle cx="90" cy="90" r="51" fill="none" stroke="#2a2f36" stroke-width="11"/>
  <circle cx="90" cy="90" r="51" fill="none" stroke="#ffffff" stroke-width="11"
          stroke-linecap="round" stroke-dasharray="231.6 320.4"
          transform="rotate(-90 90 90)"/>
  <circle cx="90" cy="90" r="20" fill="#ffffff"/>
</svg>
